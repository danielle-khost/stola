[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tunic"
dynamic = ["version"]
description = "TOGA-like projection workflow components for conserved nonexonic elements"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "TUNIC developers" }]
dependencies = ["biopython>=1.80", "networkx>=3.0", "numpy>=1.24"]

[project.optional-dependencies]
viz = ["matplotlib>=3.7"]
# compare-cross-orthology's `cluster` mode
cluster = ["matplotlib>=3.7", "pandas", "toytree>=3.0"]

[project.urls]
Homepage = "https://github.com/danielle-khost/toga4cnee"

[project.scripts]
tunic = "tunic.cli:main"
tunic-compare-cross-orthology = "tunic.cross_orthology:main"

[tool.setuptools.dynamic]
version = { attr = "tunic.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
