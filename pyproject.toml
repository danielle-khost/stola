[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stola"
dynamic = ["version"]
description = "TOGA-like projection workflow components for conserved nonexonic elements"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "STOLA developers" }]
dependencies = [
    "biopython>=1.80",
    "networkx>=3.0",
    "numpy>=1.24",
    # compare-cross-orthology's cluster mode and scripts/plot_chain_pileup.py
    "matplotlib>=3.7",
    "pandas",
    "toytree>=3.0",
]

[project.urls]
Homepage = "https://github.com/harvardinformatics/stola"

[project.scripts]
stola = "stola.cli:main"
stola-compare-cross-orthology = "stola.cross_orthology:main"

[tool.setuptools.dynamic]
version = { attr = "stola.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
